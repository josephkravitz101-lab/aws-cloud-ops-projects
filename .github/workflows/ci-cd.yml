name: "CI/CD Pipeline"

# Trigger the workflow on every push to main and on pull requests
on:
  push:
    branches:
      - main
  pull_request:

# Required permissions for AWS OIDC authentication and checking out code
permissions:
  id-token: write
  contents: read

jobs:

  # ====================== TERRAFORM JOB ======================
  # This job always runs on every push/PR (fast feedback)
  terraform:
    name: "Terraform Plan"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./project-1-terraform-elastic-infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Fix for Node.js 20 deprecation warning
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::696715200275:role/GitHubActionsRole
          aws-region: us-east-2

      - name: Terraform Format
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      # Terraform Plan always runs (safe - no changes are made)
      - name: Terraform Plan
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_allowed_ip: ${{ secrets.ALLOWED_IP }}
          TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
        run: terraform plan -no-color

  # ====================== DOCKER JOB ======================
  # This job builds and pushes the Docker image
  docker:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: terraform          # Wait for Terraform Plan to finish first
    defaults:
      run:
        working-directory: ./project-1-terraform-elastic-infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Setup Docker Buildx (required for build-push-action)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub using secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the image from ./app folder and push to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./project-1-terraform-elastic-infrastructure/app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bash-web-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max