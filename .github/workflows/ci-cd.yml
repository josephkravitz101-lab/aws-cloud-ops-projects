name: "CI/CD Pipeline"

# Trigger the workflow on push to main branch or on pull requests
on:
  push:
    branches:
      - main
  pull_request:

# Permissions needed for GitHub OIDC (AWS authentication) and checking out code
permissions:
  id-token: write   # Required to assume AWS role
  contents: read    # Required for actions/checkout

jobs:

  # ====================== TERRAFORM JOB ======================
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    # Set default working directory for all steps in this job
    defaults:
      run:
        working-directory: ./project-1-terraform-elastic-infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::696715200275:role/GitHubActionsRole
          aws-region: us-east-2

      # Terraform quality and deployment steps
      - name: Terraform Format
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_allowed_ip: ${{ secrets.ALLOWED_IP }}
        run: terraform plan -no-color

      # Only run Apply on merges to main branch (not on PRs)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_allowed_ip: ${{ secrets.ALLOWED_IP }}
        run: terraform apply -auto-approve -input=false

  # ====================== DOCKER JOB ======================
  docker:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: terraform        # Optional: Wait for Terraform job to finish first
    defaults:
      run:
        working-directory: ./project-1-terraform-elastic-infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Docker Buildx (supports multi-platform builds and caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub using secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the Docker image from the ./app folder and push it
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./app               # Path to your Dockerfile and app files
          push: true                   # Push the image to Docker Hub
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bash-web-app:latest
          cache-from: type=gha         # Use GitHub cache for faster builds
          cache-to: type=gha,mode=max