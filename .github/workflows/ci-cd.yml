name: "CI/CD Pipeline"

# Trigger the workflow on push to main or on pull requests
on:
  push:
    branches:
      - main
  pull_request:

# Permissions needed for AWS OIDC and checkout
permissions:
  id-token: write
  contents: read

jobs:

  # ====================== TERRAFORM JOB ======================
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./project-1-terraform-elastic-infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Fix for Node.js 20 deprecation warning
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::696715200275:role/GitHubActionsRole
          aws-region: us-east-2

      - name: Terraform Format
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_allowed_ip: ${{ secrets.ALLOWED_IP }}
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_allowed_ip: ${{ secrets.ALLOWED_IP }}
        run: terraform apply -auto-approve -input=false

  # ====================== DOCKER JOB ======================
  docker:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: terraform
    defaults:
      run:
        working-directory: ./project-1-terraform-elastic-infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Fix for Node.js 20 deprecation warning
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./project-1-terraform-elastic-infrastructure/app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bash-web-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max